name: Windows Cross-Build (experimental)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-cross-build:
    name: Windows x86_64 cross-build
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            extra-substituters = https://cache.nix.logos.co/public
            extra-trusted-public-keys = public:l4HrXgL4nw246+LBh2SOJyhz64BoGegOYLheT/iIAPU=

      - name: Build Windows module library
        run: |
          nix build .#packages.x86_64-windows.lib -L --fallback -o result-windows-lib

      - name: Verify Windows DLL exists
        run: |
          find -L result-windows-lib -type f -name '*.dll' -print -quit | grep -q .
          echo "PASS: Windows DLL artifact generated"

      - name: Build Windows LGX package
        run: |
          nix build .#packages.x86_64-windows.lgx -L --fallback -o result-windows-lgx

      - name: Summarize
        if: always()
        env:
          RESULT: ${{ job.status }}
        run: |
          mkdir -p windows-summary
          printf 'Windows x86_64 cross-build: %s\n' "$RESULT" > windows-summary/result.txt

      - name: Upload seven-day summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-summary
          path: windows-summary/result.txt
          retention-days: 7
