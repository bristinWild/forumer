name: CI

# Every push and pull request: run forumer_core's unit tests, then build the
# Basecamp module on Linux and macOS.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  core-tests:
    name: forumer_core unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - name: Run unit tests
        run: ./scripts/test-core.sh

  module:
    name: module (${{ matrix.os }})
    needs: core-tests
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Builds of the Logos stack are big: make room on the runner first.
      - name: Free disk space
        if: runner.os == 'Linux'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          # Logos' public binary cache (the one logos-module-builder names):
          # prebuilt Logos SDK, Qt and modules instead of compiling them.
          extra-conf: |
            extra-substituters = https://cache.nix.logos.co/public
            extra-trusted-public-keys = public:l4HrXgL4nw246+LBh2SOJyhz64BoGegOYLheT/iIAPU=
      - name: Build module
        run: nix build -L
