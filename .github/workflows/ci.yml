name: CI

# Every push and pull request: run forumer_core's unit tests, then build the
# Basecamp module on Linux and macOS.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  core-tests:
    name: forumer_core unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Run unit tests
        run: ./scripts/test-core.sh

  module:
    name: module (${{ matrix.os }})
    needs: core-tests
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      # Logos' public binary cache: saves rebuilding the Logos SDK and modules.
      - uses: cachix/cachix-action@v15
        with:
          name: logos-co
          skipPush: true
      - name: Build module
        run: nix build -L
