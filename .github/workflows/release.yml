name: Release

# Push a tag like v0.2.0 and this attaches installable packages to a GitHub
# release: forumer-<version>-<platform>.lgx, which Basecamp installs from file.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lgx:
    name: package (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
          - os: macos-14
            platform: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Builds of the Logos stack are big: make room on the runner first.
      - name: Free disk space
        if: runner.os == 'Linux'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          # Logos' public binary cache (the one logos-module-builder names):
          # prebuilt Logos SDK, Qt and modules instead of compiling them.
          extra-conf: |
            extra-substituters = https://cache.nix.logos.co/public
            extra-trusted-public-keys = public:l4HrXgL4nw246+LBh2SOJyhz64BoGegOYLheT/iIAPU=
      - name: Build portable package
        # Downloads from the binary caches occasionally drop mid-transfer:
        # retry, and build anything that still can't be fetched (--fallback).
        run: |
          for i in 1 2 3; do
            nix build -L .#lgx-portable --fallback && exit 0
            echo "build attempt $i failed, retrying"; sleep 20
          done
          exit 1
      - name: Name the package
        run: |
          version="$(jq -r .version metadata.json)"
          file="$(find -L result -name '*.lgx' | head -n1)"
          test -n "$file" || { echo "no .lgx in result/"; ls -laR result; exit 1; }
          mkdir -p dist
          cp "$file" "dist/forumer-${version}-${{ matrix.platform }}.lgx"
          (cd dist && shasum -a 256 *.lgx > "forumer-${version}-${{ matrix.platform }}.sha256")
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: forumer-${{ matrix.platform }}
          path: dist/*
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true